# Telegram notifications for users' favorites (see docs/notifications.md).
# Scheduled workflows only run from the repository's default branch.
name: Notifications

on:
  schedule:
    # Mondays at 07:00 UTC: favorites reporting earnings in the next 7 days.
    - cron: "0 7 * * 1"
    # Every day at 13:00 UTC: summaries of favorites' new earnings calls.
    - cron: "0 13 * * *"
    # Weekdays at 21:30 UTC, after the US close: the day's relevant news about favorites.
    - cron: "30 21 * * 1-5"
    # Every day at 22:30 UTC, after the evening's 8-Ks: analyses of favorites' new SEC filings.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Which notification to send
        type: choice
        options: [earnings, transcripts, news, filings]
        default: transcripts

concurrency:
  group: notifications-${{ github.event.inputs.kind || github.event.schedule }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send notifications
        run: npm run notify:${{ github.event.inputs.kind || (github.event.schedule == '0 7 * * 1' && 'earnings') || (github.event.schedule == '30 21 * * 1-5' && 'news') || (github.event.schedule == '30 22 * * *' && 'filings') || 'transcripts' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
