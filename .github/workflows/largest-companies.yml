# Refreshes the largest-companies snapshot the Stocks page falls back to (see docs/stock-overview.md)
# and commits it. Scheduled workflows only run from the repository's default branch.
name: Largest companies snapshot

on:
  schedule:
    # Sundays at 06:00 UTC, after the week's last close.
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: largest-companies

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script uses only Node's built-ins, so there's nothing to install.
      - name: Rebuild the snapshot
        run: npm run largest:update
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Commit it
        run: |
          if git diff --quiet -- src/data/largest-us-companies.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/largest-us-companies.json
          git commit -m "chore: refresh the largest companies snapshot"
          git push
